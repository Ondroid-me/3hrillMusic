name: Scrape The Pulse

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: pulse-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape once and write feed.json
        run: python pulse.py --once

      - name: Commit updated feed
        run: |
          git config user.name  "pulse-bot"
          git config user.email "pulse-bot@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || git commit -m "Auto-scrape $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
